[tools]
"github:facebookincubator/scrut" = "0.4.2"
go = "1.26.5"

[tasks.build]
description = "Build henia binary"
run = "go build -o henia ./cmd/henia"

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:integration"]

[tasks."test:unit"]
description = "Run Go unit tests"
run = "go test ./internal/... ./cmd/..."

[tasks."test:integration"]
description = "Run scrut integration tests"
depends = ["build"]
run = "PATH=$PWD:$PATH scrut test tests/*.md"

[tasks."test:acceptance"]
description = "Run live harness acceptance tests (claude -p, codex exec); TROPOS=<checkout> links a local Tropos"
depends = ["build"]
run = "PATH=$PWD:$PATH scrut test --timeout-seconds 900 tests/acceptance/*.md"

[tasks."phora:pin"]
description = "Pin the phora release henia fetches when phora is missing: mise run phora:pin 0.4.3"
usage = 'arg "<version>"'
run = [
  "curl -fsSL https://github.com/srnnkls/phora/releases/download/v${usage_version}/sha256.sum -o internal/deps/phora.sum",
  "echo ${usage_version} > internal/deps/phora.version",
  "go test ./internal/deps -run TestPinnedRelease",
]
