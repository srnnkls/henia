spec: markup-pipeline
created: 2026-01-15
last_updated: 2026-01-20
review_status: complete
review_date: 2026-01-15

# Validation coverage from spec-validate (if used)
taxonomy_coverage:
  scope: complete
  behavior: complete
  data_model: complete
  constraints: complete
  edge_cases: complete
  integration: complete
  terminology: complete

# Review configuration for task-dispatch
review_config:
  reviewers:
    - type: claude
      model: opus
    - type: opencode
      model: openai/gpt-5.2-pro
    - type: opencode
      model: google/gemini-3-pro-preview
  batch_size: 3
  review_triggers:
    - on_phase_complete
    - on_critical_path_milestone

# Unresolved markers requiring clarification
markers:
  - id: M001
    status: resolved
    severity: critical
    area: integration
    description: Goldmark markdown output strategy needs implementation
    context: Goldmark renders to HTML by default, need custom TextRenderer for markdown output
    assigned_doc: context.md
    section: Goldmark Extension Strategy
    resolution: Added MarkdownRenderer pattern in context.md
    resolved_by: spec-review
    resolved_at: 2026-01-15
  - id: M002
    status: resolved
    severity: high
    area: behavior
    description: Attribute syntax grammar needs formal definition
    context: "Attributes use quoted key-value: {key=\"value\"}"
    assigned_doc: spec.md
    section: Semantic Markup Layer
    resolution: Added Attribute Syntax Grammar section with rules and examples
    resolved_by: spec-review
    resolved_at: 2026-01-15
  - id: M003
    status: resolved
    severity: high
    area: behavior
    description: XML output contract needs specification
    context: Only directives→XML, standard markdown passes through
    assigned_doc: spec.md
    section: XML Rendering
    resolution: Added XML Output Contract with example showing mixed output
    resolved_by: spec-review
    resolved_at: 2026-01-15
  - id: M004
    status: resolved
    severity: medium
    area: scope
    description: CUE layer removed - transforms handled by schema-transform spec
    context: Inline computation blocks unnecessary; harness transforms use Starlark
    assigned_doc: spec.md
    section: Out of Scope
    resolution: Removed CUE layer, added reference to schema-transform spec
    resolved_by: spec-clarify
    resolved_at: 2026-01-20

# Complexity tracking
complexity:
  cyclomatic: low
  integration_points: 2
  external_dependencies: 1
  risk_areas:
    - Goldmark parser edge cases
    - Template + directive interaction

# Implementation gates (pre-implementation checks)
gates:
  architecture_review:
    status: pending
    description: Two-layer separation verified
    criteria:
      - Each layer uses dedicated engine
      - No overlap between layers
      - Processing order correct
    verified: false

  dependency_audit:
    status: pending
    description: External dependencies acceptable
    criteria:
      - Goldmark widely used and tested
      - No security vulnerabilities
    verified: false

  backwards_compatibility:
    status: pending
    description: Existing configs work unchanged
    criteria:
      - Default format is pass-through
      - Variable-based templates still work
      - No breaking changes to artifact structure
    verified: false

  performance_baseline:
    status: pending
    description: Performance requirements clear
    criteria:
      - Target <100ms for typical skill
      - Memory usage acceptable
      - No blocking operations
    verified: false

# Test coverage requirements
test_coverage:
  unit_tests:
    - Block parser (valid, nested, malformed, edge cases)
    - Inline parser (valid, nested, malformed, edge cases)
    - XML renderer (block, inline, attributes, escaping)
    - Pass-through renderer (block, inline, preservation)

  integration_tests:
    - Full pipeline (templates → goldmark → references)
    - Format selection (xml vs directives)
    - Backwards compatibility with existing artifacts

  end_to_end_tests:
    - Real skill files with templates and directives
    - Claude harness XML output
    - Default harness pass-through
    - Performance verification

# Edge cases requiring explicit tests
edge_cases:
  goldmark:
    - Nested fenced divs (multiple levels)
    - Escaped syntax (\:::, \:name)
    - Malformed attributes (missing quotes, empty values)
    - Empty blocks and directives
    - Special characters in attribute values
    - Unicode in content and attributes

  pipeline:
    - Template conditionally includes directive
    - Template generates directive syntax
    - Directive in frontmatter string values
    - References in directive content
    - Multiple layers interacting

# Migration validation
migration:
  backwards_compatibility:
    - Configs without Format field work
    - Existing Variable templates work
    - Artifacts without directives work

  gradual_adoption:
    - Can add Format to one harness at a time
    - Can migrate directives incrementally
    - Old and new syntax coexist

# Success metrics
success_metrics:
  correctness:
    - All acceptance criteria met
    - All edge cases handled
    - No regressions in existing behavior

  performance:
    - Process typical skill in <100ms
    - Memory usage stable (no leaks)
    - Scales linearly with content size

  maintainability:
    - Code follows Go idioms
    - Clear error messages with positions
    - Comprehensive test coverage
    - Documentation complete

# Known limitations (acceptable trade-offs)
limitations:
  - Attributes must always use quotes (no unquoted values)
  - Directive names must be valid Go identifiers
  - No custom attribute transformations in v1

# Open questions
open_questions: []

# Notes
notes: |
  2026-01-20: Removed CUE layer. Harness-specific frontmatter transforms
  are now handled by the schema-transform spec using Starlark.
  This spec focuses solely on Goldmark directive parsing and rendering.
