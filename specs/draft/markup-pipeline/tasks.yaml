phases:
  - name: "Phase 1: CUE Preprocessing"
    task_ids: [MPL-001, MPL-003, MPL-004, MPL-005, MPL-006]
    checkpoint:
      description: CUE extraction and evaluation working
      criteria:
        - Multi-block extraction preserves order
        - CUE context includes frontmatter and config
        - Validation errors include helpful messages
        - Tests pass
      verified: false
  - name: "Phase 2: Fenced Div Parsers"
    task_ids: [MPL-002, MPL-007, MPL-008, MPL-009, MPL-010, MPL-011, MPL-012]
    checkpoint:
      description: Goldmark parsers working for both block and inline directives
      criteria:
        - Block parser handles :::name{attrs} syntax
        - Inline parser handles :name[content]{attrs} syntax
        - Both handle quoted attributes
        - Tests pass with edge cases
      verified: false
  - name: "Phase 3: Renderers"
    task_ids: [MPL-013, MPL-014, MPL-015]
    checkpoint:
      description: XML and pass-through renderers working
      criteria:
        - XML renderer handles both node types
        - Pass-through renderer preserves original syntax
        - Attribute escaping works correctly
        - Tests pass
      verified: false
  - name: "Phase 4: Transform Integration"
    task_ids: [MPL-016, MPL-017, MPL-018, MPL-019, MPL-020]
    checkpoint:
      description: Full pipeline integrated
      criteria:
        - CUE runs before templates
        - Templates run before goldmark
        - References run after goldmark
        - Backwards compatibility maintained
      verified: false
  - name: "Phase 5: Integration Testing"
    task_ids: [MPL-021, MPL-022, MPL-023, MPL-024]
    checkpoint:
      description: End-to-end testing complete
      criteria:
        - Real skill files process correctly
        - XML output verified for Claude
        - Pass-through verified for default
        - Performance acceptable (<100ms)
      verified: false
