notes: |
  Architecture pivoted during review from CUE to Starlark.

  Key insights from review:
  - OpenCode and Claude skill frontmatter are fixed, tiny schemas (~5 fields)
  - CUE's power (arbitrary schema transformation) isn't needed
  - Starlark provides Python-like syntax with lower learning curve
  - TOML already handles 90% of customization needs

  The new architecture separates concerns cleanly:
  - TOML: declarative config (variables, tool mappings, references)
  - Starlark: non-trivial logic (conditionals, coupling rules, reshaping)
  - Go: rendering, I/O, validation
