# Built-in skill profiles. See docs/vendor-research.md.
artifacts = ["skills"]

[harness.claude]
profile = "claude"
directives = "xml"
layout = "nested"
artifacts = ["skills"]

[harness.claude.variables]
model_strong = "opus"
model_normal = "sonnet"
model_weak = "haiku"

[harness.claude.tools]
bash = "Bash"
read = "Read"
write = "Write"
edit = "Edit"
glob = "Glob"
grep = "Grep"
task = "Task"

[harness.claude.references]
skill = "/{{.Name}}"

[harness.claude-upload]
profile = "claude-upload"
directives = "xml"
layout = "nested"
artifacts = ["skills"]

[harness.codex]
profile = "codex"
directives = "keep"
layout = "nested"
artifacts = ["skills"]

[harness.codex.references]
skill = "${{.Name}}"

[harness.chatgpt]
profile = "chatgpt"
directives = "keep"
layout = "nested"
artifacts = ["skills"]

[harness.chatgpt.references]
skill = "@{{.Name}}"

[harness.opencode]
profile = "opencode"
directives = "keep"
layout = "nested"
artifacts = ["skills"]

[harness.opencode.references]
skill = 'skill({name: "{{.Name}}"})'

[harness.gemini]
profile = "gemini"
directives = "keep"
layout = "nested"
artifacts = ["skills"]

[harness.gemini.references]
skill = 'activate_skill({name: "{{.Name}}"})'

[harness.github]
profile = "github"
directives = "keep"
layout = "nested"
artifacts = ["skills"]

[harness.cursor]
profile = "cursor"
directives = "keep"
layout = "nested"
artifacts = ["skills"]

[harness.cursor.references]
skill = "/{{.Name}}"

[harness.agentskills]
profile = "agentskills"
directives = "keep"
layout = "nested"
artifacts = ["skills"]
