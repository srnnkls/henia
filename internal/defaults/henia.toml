# Built-in skill profiles. See docs/vendor-research.md.
artifacts = ["skills"]

[harness.claude]
profile = "claude"
path = ".claude"
format = "xml"
structure = "nested"
artifacts = ["skills"]

[harness.claude.variables]
model_strong = "opus"
model_normal = "sonnet"
model_weak = "haiku"

[harness.claude.tools]
bash = "Bash"
read = "Read"
write = "Write"
edit = "Edit"
glob = "Glob"
grep = "Grep"
task = "Task"

[harness.claude.references.skill]
output = "/{{.Name}}"

[harness.claude-upload]
profile = "claude-upload"
path = ".henia/packages/claude-upload"
format = "xml"
structure = "nested"
artifacts = ["skills"]

[harness.codex]
profile = "codex"
path = ".agents"
format = "directives"
structure = "nested"
artifacts = ["skills"]

[harness.codex.references.skill]
output = "${{.Name}}"

[harness.chatgpt]
profile = "chatgpt"
path = ".henia/packages/chatgpt"
format = "directives"
structure = "nested"
artifacts = ["skills"]

[harness.chatgpt.references.skill]
output = "@{{.Name}}"

[harness.opencode]
profile = "opencode"
path = ".opencode"
format = "directives"
structure = "nested"
artifacts = ["skills"]

[harness.opencode.references.skill]
output = 'skill({name: "{{.Name}}"})'

[harness.gemini]
profile = "gemini"
path = ".gemini"
format = "directives"
structure = "nested"
artifacts = ["skills"]

[harness.gemini.references.skill]
output = 'activate_skill({name: "{{.Name}}"})'

[harness.github]
profile = "github"
path = ".github"
format = "directives"
structure = "nested"
artifacts = ["skills"]

[harness.cursor]
profile = "cursor"
path = ".cursor"
format = "directives"
structure = "nested"
artifacts = ["skills"]

[harness.cursor.references.skill]
output = "/{{.Name}}"

[harness.agentskills]
profile = "agentskills"
path = ".henia/packages/agentskills"
format = "directives"
structure = "nested"
artifacts = ["skills"]
