# See docs/vendor-research.md for the supporting vendor contracts.
directives = "keep"
# Built into pi: https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/slash-commands.md
commands = ["settings", "model", "thinking", "scoped-models", "login", "logout", "llama", "new", "resume", "name", "session", "tree", "fork", "clone", "compact", "import", "copy", "export", "share", "bug", "trust", "reload", "hotkeys", "changelog", "quit", "mcp"]

[skill]
fields = ["name", "description", "license", "compatibility", "metadata", "allowed-tools", "disable-model-invocation"]
controls = ["auto_invoke"]
consume = ["tools"]

[skill.aliases]
allowed_tools = "allowed-tools"
disallowed_tools = "disallowed-tools"
argument_hint = "argument-hint"
disable_model_invocation = "disable-model-invocation"

[skill.computed]
"allowed-tools" = '(input.tools ?? input.allowed_tools ?? input["allowed-tools"]) == nil ? nil : toolNames(input.tools ?? input.allowed_tools ?? input["allowed-tools"], ctx.tools)'
"disable-model-invocation" = 'settings.auto_invoke == nil ? nil : not settings.auto_invoke'

[config.files.main]
path = "settings.json"
format = "json"
schema = "https://pi.dev/schemas/settings.schema.json"
merge = true

[config.files.mcp]
path = "mcp.json"
format = "json"
merge = true
entries = ["mcpServers"]
value = '''
{mcpServers: fromPairs(map(toPairs(shared.mcp ?? {}), let s = #[1]; [#[0], {
  command: s.command,
  args: s.args,
  url: s.url,
  env: s.env == nil ? nil : fromPairs(map(toPairs(s.env), [#[0], hasPrefix(#[1], "$") ? "${" + trimPrefix(#[1], "$") + "}" : #[1]]))
}]))}
'''
