artifacts = ["skills", "commands", "agents"]

[harness.flat-agent]
layout = "flat"

[harness.flat-agent.frontmatter.rename]
allowed_tools = "tools"

[harness.flat-agent.variables]
model_strong = "anthropic/claude-sonnet-4-5"
model_weak = "anthropic/claude-haiku-4-5"

[harness.flat-agent.tools]
bash = "bash"
read = "read"
write = "write"

[harness.flat-agent.references]
skill = "@{{.Name}}"
