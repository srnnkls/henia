artifacts = ["skills", "commands", "agents"]

[harness.claude]
structure = "nested"

[harness.claude.variables]
model_strong = "opus"
model_normal = "sonnet"
model_weak = "haiku"

[harness.claude.tools]
bash = "Bash"
read = "Read"
write = "Write"

[harness.claude.references.skill]
output = "/{{.Name}}"

[harness.claude.references.command]
output = "/{{.Name}}"
