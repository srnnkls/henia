artifacts = ["skills"]

[build]
output = ".henia/build"

[harness.claude]
profile = "claude"
directives = "xml"

[harness.claude.variables]
review_mode = "thorough"

[harness.claude.tools]
read = "Read"

[harness.codex]
profile = "codex"
directives = "keep"

[harness.codex.variables]
review_mode = "focused"

[harness.codex.tools]
read = "read_file"

[lint.config.large-skill]
max-lines = 500

[lint.config.stale-review]
max-age-days = 180

[lint.config.outdated-reference.outdated]
"old-model-id" = "replacement-model-id"

[[lint.rules]]
id = "instruction-priority"
query = '(directive :name "instruction" :dynamic (not "true") :priority (not /^(normal|high|critical)$/)) @d'
message = "Instructions need a valid priority."

[[lint.rules]]
id = "skill-description"
query = '(file :kind skill (frontmatter (entry :key description :chars (< 30)))) @f'
message = "Describe what this skill does and when to use it."
severity = "error"
